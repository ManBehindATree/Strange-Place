<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???</title>

    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .center-image {
            max-width: 80%;
            max-height: 80%;
            cursor: pointer;
        }

        #text {
            color: white;
            margin-top: 20px;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>

<body onclick="backgroundClick()">

    <img src="Tree.png" alt="Image" class="center-image" onclick="imageClick(event)">

    <audio id="music" loop>
        <source src="Man_music.ogg" type="ogg">
    </audio>

    <div id="text"></div>

    <script>
        let imageClicks = 0;
        let backgroundClicks = 0;

        function imageClick(event) {
            event.stopPropagation();

            let audio = document.getElementById("music");
            audio.play();

            imageClicks++;

            if (imageClicks === 1) {
                document.getElementById("text").innerHTML = "Well, there is a man here.";
            }
            else if (imageClicks === 2) {
                document.getElementById("text").innerHTML = "He offers you something.";
            }
            else if (imageClicks === 3) {
                document.getElementById("text").innerHTML = "You got an Egg";
            }
        }
    </script>

</body>
</html>
