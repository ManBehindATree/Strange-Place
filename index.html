<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???</title>

    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .center-image {
            max-width: 80%;
            max-height: 80%;
            cursor: pointer;
        }

        #text {
            color: white;
            margin-top: 20px;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>

<body onclick="backgroundClick()">

    <img src="Tree.png" class="center-image" onclick="imageClick(event)">


    <!-- Background music -->
    <audio id="music" loop>
        <source src="music.ogg" type="audio/ogg">
    </audio>


    <!-- Sound effect -->
    <audio id="sound">
        <source src="sound.mp3" type="audio/mpeg">
    </audio>


    <div id="text"></div>


    <script>

        let imageClicks = 0;
        let musicStarted = false;


        function startMusic() {
            if (!musicStarted) {
                let music = document.getElementById("music");
                music.play();
                musicStarted = true;
            }
        }


        function imageClick(event) {
            event.stopPropagation();

            startMusic();

            imageClicks++;


            if (imageClicks === 1) {
                document.getElementById("text").innerHTML = "Well, there is a man here.";
            }

            else if (imageClicks === 2) {
                document.getElementById("text").innerHTML = "He offers you something.";
            }

            else if (imageClicks === 3) {
                document.getElementById("text").innerHTML = "You got an Egg.";

                let sound = document.getElementById("sound");
                sound.currentTime = 0;
                sound.play();
            }

        }


        function backgroundClick() {

            startMusic();

            document.getElementById("text").innerHTML = "He is behind the tree.";

            // Reset image messages
            imageClicks = 0;
        }


    </script>

</body>
</html>
